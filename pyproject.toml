[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crochetpatterngen-engine"
version = "0.1.0"
description = "Deterministic photo-to-crochet-chart engine (stitch counts, 5 techniques, C2C aspect correction) + MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CrochetPatternGen" }]
keywords = ["crochet", "chart", "graphgan", "c2c", "tapestry", "mosaic", "filet", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
rembg = ["rembg>=2.0.50"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://crochetpatterngen.com"
Repository = "https://github.com/dengyu123456/crochet-engine"

[project.scripts]
crochet-chart = "crochet_chart_engine.cli:main"
crochetpatterngen-mcp = "crochet_chart_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
